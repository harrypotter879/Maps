<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 700px; overflow: hidden; }
    #globe { width: 100vw; height: 700px; background: #071a2e; }
  </style>
</head>
<body>
  <div id="globe" aria-label="Interactive 3D globe"></div>
  <script>
    const post = (type, extra = {}) => parent.postMessage({
      isStreamlitMessage: true,
      type,
      ...extra,
    }, "*");

    let latestArgs = {};
    let map = null;
    window.addEventListener("message", (event) => {
      if (event.data && event.data.type === "streamlit:render") {
        latestArgs = event.data.args || {};
        if (map) updateMap(latestArgs);
      }
    });

    post("streamlit:componentReady", { apiVersion: 1 });
    post("streamlit:setFrameHeight", { height: 700 });

    map = new maplibregl.Map({
      container: "globe",
      center: [85.2987681, 23.3191843],
      zoom: 1.35,
      minZoom: 0.7,
      maxZoom: 17,
      style: {
        version: 8,
        projection: { type: "globe" },
        sources: {
          osm: {
            type: "raster",
            tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
            tileSize: 256,
            attribution: "&copy; OpenStreetMap contributors",
          },
        },
        layers: [{ id: "osm-layer", type: "raster", source: "osm" }],
        sky: {
          "atmosphere-blend": ["interpolate", ["linear"], ["zoom"], 0, 1, 5, 1, 7, 0],
        },
      },
    });

    map.addControl(new maplibregl.NavigationControl({ showCompass: true }), "top-right");
    window.addEventListener("resize", () => map.resize());
    setTimeout(() => map.resize(), 250);
      setTimeout(() => updateMap(latestArgs), 1000);
    map.on("load", () => updateMap(latestArgs));
    map.on("click", (event) => post("streamlit:setComponentValue", {
      value: {
        event: "click",
        latitude: event.lngLat.lat,
        longitude: event.lngLat.lng,
        id: Date.now(),
      },
    }));

    function updateMap(args) {
      latestArgs = args || {};
      if (!map.loaded()) return;
      const center = latestArgs.center;
      if (center && Number.isFinite(center[0]) && Number.isFinite(center[1])) {
        const cameraPoints = [];
        (latestArgs.points || []).forEach(point => {
          if (Number.isFinite(point.lat) && Number.isFinite(point.lon)) {
            cameraPoints.push([point.lon, point.lat]);
          }
        });
        (latestArgs.route || []).forEach(point => {
          if (Number.isFinite(point[0]) && Number.isFinite(point[1])) {
            cameraPoints.push([point[1], point[0]]);
          }
        });

        if (cameraPoints.length > 1) {
          const bounds = cameraPoints.reduce(
            (result, point) => result.extend(point),
            new maplibregl.LngLatBounds(cameraPoints[0], cameraPoints[0])
          );
          map.fitBounds(bounds, { padding: 55, maxZoom: 5, duration: 700 });
        } else {
          map.flyTo({ center: [center[1], center[0]], zoom: 5, duration: 700 });
        }
      }
      const points = latestArgs.points || [];
      if (map.getSource("globe-points")) map.getSource("globe-points").setData({ type: "FeatureCollection", features: points.map(point => ({
        type: "Feature", geometry: { type: "Point", coordinates: [point.lon, point.lat] }, properties: { label: point.label || "Point" }
      })) });
      else map.addSource("globe-points", { type: "geojson", data: { type: "FeatureCollection", features: points.map(point => ({
        type: "Feature", geometry: { type: "Point", coordinates: [point.lon, point.lat] }, properties: { label: point.label || "Point" }
      })) } });
      if (!map.getLayer("globe-points-layer")) map.addLayer({ id: "globe-points-layer", type: "circle", source: "globe-points", paint: {
        "circle-radius": 7, "circle-color": "#ef4444", "circle-stroke-color": "#fff", "circle-stroke-width": 2
      } });
      const route = latestArgs.route || [];
      const routeData = { type: "Feature", geometry: { type: "LineString", coordinates: route.map(point => [point[1], point[0]]) } };
      if (map.getSource("globe-route")) map.getSource("globe-route").setData(routeData);
      else map.addSource("globe-route", { type: "geojson", data: routeData });
      if (!map.getLayer("globe-route-layer")) map.addLayer({ id: "globe-route-layer", type: "line", source: "globe-route", paint: {
        "line-color": "#2563eb", "line-width": 5, "line-opacity": 0.9
      } });
      const aqiLayer = "globe-aqi-layer";
      const aqiSource = "globe-aqi";
      if (latestArgs.aqi && !map.getSource(aqiSource)) {
        map.addSource(aqiSource, { type: "raster", tiles: [`https://tiles.aqicn.org/tiles/usepa-aqi/{z}/{x}/{y}.png?token=${latestArgs.aqi_token || "demo"}`], tileSize: 256 });
        map.addLayer({ id: aqiLayer, type: "raster", source: aqiSource, paint: { "raster-opacity": 0.72 } });
      } else if (!latestArgs.aqi && map.getLayer(aqiLayer)) {
        map.removeLayer(aqiLayer);
        map.removeSource(aqiSource);
      }
    }

  </script>
</body>
</html>
